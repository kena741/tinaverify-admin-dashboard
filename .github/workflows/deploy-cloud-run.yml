name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - staging
      - production
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cloud-run-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name }})
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name }}
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'zulu-dine-492112' }}
      NEXT_PUBLIC_BACKEND_BASE_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_BASE_URL }}
    steps:
      - name: Validate configuration
        run: |
          test -n "${{ secrets.GCP_SA_KEY }}" || (echo "Missing secret GCP_SA_KEY (JSON key for github-actions-tinaverify@zulu-dine-492112.iam.gserviceaccount.com)" && exit 1)
          test -n "${NEXT_PUBLIC_BACKEND_BASE_URL}" || (echo "Missing environment secret NEXT_PUBLIC_BACKEND_BASE_URL for ${TARGET}" && exit 1)

      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy via Cloud Build
        run: |
          if [ "${TARGET}" = "production" ]; then
            CONFIG=cloudbuild-production.yaml
            TAG="${GITHUB_SHA::7}"
            SERVICE=tinaverify-admin
            IMAGE="europe-west3-docker.pkg.dev/${GCP_PROJECT_ID}/zuludine-frontend/zuludine-fe:${TAG}"
          else
            CONFIG=cloudbuild-staging.yaml
            TAG="staging-${GITHUB_SHA::7}"
            SERVICE=tinaverify-admin-staging
            IMAGE="europe-west3-docker.pkg.dev/${GCP_PROJECT_ID}/zuludine-frontend/zuludine-fe:${TAG}"
          fi

          gcloud builds submit \
            --project="${GCP_PROJECT_ID}" \
            --config="${CONFIG}" \
            --substitutions="_IMAGE=${IMAGE},_SERVICE=${SERVICE},_REGION=europe-west4,_NEXT_PUBLIC_BACKEND_BASE_URL=${NEXT_PUBLIC_BACKEND_BASE_URL},_NEXT_PUBLIC_ADMIN_GRANT_CREDITS=true,_NEXT_PUBLIC_ADMIN_BUSINESS_SMS=false"
