substitutions:
  _IMAGE: europe-west3-docker.pkg.dev/zulu-dine-492112/zuludine-frontend/zuludine-fe:latest
  _NEXT_PUBLIC_BACKEND_BASE_URL: https://zuludine-backend-prod-562272610794.europe-west3.run.app
  _NEXT_PUBLIC_ADMIN_GRANT_CREDITS: "true"
  _NEXT_PUBLIC_ADMIN_BUSINESS_SMS: "true"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_BACKEND_BASE_URL=${_NEXT_PUBLIC_BACKEND_BASE_URL}
      - --build-arg
      - NEXT_PUBLIC_ADMIN_GRANT_CREDITS=${_NEXT_PUBLIC_ADMIN_GRANT_CREDITS}
      - --build-arg
      - NEXT_PUBLIC_ADMIN_BUSINESS_SMS=${_NEXT_PUBLIC_ADMIN_BUSINESS_SMS}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
